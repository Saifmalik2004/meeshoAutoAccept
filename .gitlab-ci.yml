stages:
  - meesho

meesho_auto_accept:
  stage: meesho
  image: mcr.microsoft.com/playwright:v1.48.0-jammy

  script:
    - echo "📦 Installing dependencies..."
    - npm ci || npm install
    - echo "🧩 Ensuring Playwright Chromium is installed..."
    - npx playwright install chromium
    - echo "🚀 Running Meesho auto-accept + label download..."
    - npm run meesho:run

  variables:
    MEESHO_EMAIL: "$MEESHO_EMAIL"
    MEESHO_PASSWORD: "$MEESHO_PASSWORD"
    MEESHO_URL: "https://supplier.meesho.com/"

  artifacts:
    when: always
    paths:
      - labels/
    expire_in: 7 days

  rules:
    # 1) Schedule se chale
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # 2) Manual "Run pipeline" se bhi chale (test ke time)
    - if: '$CI_PIPELINE_SOURCE == "web"'
